    <style>
       
        .item-list > a {

        }

        .status-dot {

            margin-left: 12px;
        }

        .item-list .status-dot {
            margin-left: 8px;
        }

        .item-list > a {
            padding-right: 20px;
        }

        @media (max-width: 600px) {
            .item-list > a {
                padding-right: 12px;
            }
            .status-dot {
                width: 10px;
                height: 10px;
                margin-left: 8px;
            }
            .status-dot::after {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        .status-dot {
            overflow: visible !important;
            position: relative;
        }

    </style>
</head>
